[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0.102"
iroh = "1.1.0"
iroh-blobs = "0.103.0"
iroh-docs = "0.101.0"
iroh-gossip = "0.101.0"
thiserror = "2.0.18"
tokio = { version = "1", features = ["sync", "rt", "time", "io-util"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
redb = "4.2.0"
tempfile = "3.27.0"
postcard = "1.1.3"
lru = "0.18.4"
bytes = "1.11.1"
tokio-stream = "0.1.18"
futures = "0.3.32"
async-stream = "0.3.6"

hamt2 = { path = "crates/hamt2" }
